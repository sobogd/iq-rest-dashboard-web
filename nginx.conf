server {
    listen 80;
    server_name dashboard.iq-rest.com;

    root /home/deploy/apps/iq-rest-dashboard/dashboard;
    index index.html;

    # Long-cache hashed assets, immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No-cache index.html so deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SSE order stream: disable buffering and bump read timeout. Without these
    # nginx batches chunks and tears the connection at the default 60s, which
    # would make the dashboard fall back to 30s polling forever.
    location = /api/orders/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # SPA fallback — every other path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Kiosk subdomains. Same SPA bundle as the admin dashboard — the routing
# branch lives in src/main.tsx (getKioskRole()). Each role gets its own
# one-letter subdomain for easier touchscreen entry: k.* = kitchen
# display, w.* = waiter terminal. Both reuse the same /api proxy and SSE
# tweaks. Keeping the blocks identical aside from server_name so the
# behaviour stays uniform.
server {
    listen 80;
    server_name k.iq-rest.com w.iq-rest.com;

    root /home/deploy/apps/iq-rest-dashboard/dashboard;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SSE — keep buffering off and timeout long so the channel survives.
    location = /api/devices/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # Everything else under /api proxies to the dashboard-api backend so
    # the kitchen SPA stays same-origin (avoids CORS on every fetch and
    # the EventSource withCredentials dance).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
